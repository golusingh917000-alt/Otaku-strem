<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>OTAKU STREAM PRO</title>
                <script src="https://jsdelivr.net"></script>
                    <style>
                            * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
                                    body { background: #0b0c10; color: #fff; padding-bottom: 25px; }
                                            header { background: #1f2833; padding: 14px; text-align: center; border-bottom: 2px solid #ff4757; position: sticky; top: 0; z-index: 99; }
                                                    header h1 { font-size: 18px; color: #ff4757; letter-spacing: 1px; }
                                                            .container { padding: 12px; }
                                                                    .anime-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
                                                                            .anime-card { background: #1f2833; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
                                                                                    .anime-card img { width: 100%; height: 200px; object-fit: cover; background: #1a1a1a; }
                                                                                            .card-info { padding: 8px; }
                                                                                                    .card-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
                                                                                                            .rating { color: #f1c40f; font-size: 12px; margin-top: 4px; }
                                                                                                                    .back-btn { background: #ff4757; color: #fff; border: none; padding: 8px 15px; border-radius: 6px; margin-bottom: 10px; font-weight: bold; }
                                                                                                                            .player-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 10px; border: 1px solid #333; }
                                                                                                                                    video, iframe { width: 100%; height: 100%; border: none; }
                                                                                                                                            .anime-desc { font-size: 12px; color: #ccc; background: #1f2833; padding: 10px; border-radius: 8px; margin: 8px 0 12px; line-height: 1.4; }
                                                                                                                                                    .ep-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
                                                                                                                                                            .ep-btn { background: #1f2833; color: #fff; border: 1px solid #45a29e; padding: 9px; border-radius: 6px; text-align: center; font-size: 13px; font-weight: bold; }
                                                                                                                                                                    .ep-btn.active { background: #ff4757; border-color: #ff4757; }
                                                                                                                                                                            .loader { text-align: center; padding: 40px; color: #66fcf1; font-weight: bold; }
                                                                                                                                                                                </style>
                                                                                                                                                                                </head>
                                                                                                                                                                                <body>
                                                                                                                                                                                    <header><h1>OTAKU STREAM • HINDI</h1></header>
                                                                                                                                                                                        <div class="container">
                                                                                                                                                                                                <div id="loader" class="loader">एनीमे लोड हो रहे हैं...</div>
                                                                                                                                                                                                        <div id="home-view" class="anime-grid"></div>
                                                                                                                                                                                                                <div id="detail-view" style="display:none;">
                                                                                                                                                                                                                            <button class="back-btn" onclick="goHome()">← वापस होम पर जाएं</button>
                                                                                                                                                                                                                                        <div class="player-box" id="player-container"></div>
                                                                                                                                                                                                                                                    <h2 id="detail-title" style="color:#66fcf1; font-size:18px;"></h2>
                                                                                                                                                                                                                                                                <div id="detail-rating" class="rating"></div>
                                                                                                                                                                                                                                                                            <p id="detail-synopsis" class="anime-desc"></p>
                                                                                                                                                                                                                                                                                        <h3 style="font-size:15px;">एपिसोड चुनें:</h3>
                                                                                                                                                                                                                                                                                                    <div id="episode-list" class="ep-grid"></div>
                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                                                                                                                    const SHEET_ID = "10gs9aHw9JWKFP7lY_j_k4OOdljkFv4pfNv69GVJ9lZY";
                                                                                                                                                                                                                                                                                                                        const SHEET_URL = `https://google.com{SHEET_ID}/gviz/tq?tqx=out:json`;
                                                                                                                                                                                                                                                                                                                            let animeDB = {};

                                                                                                                                                                                                                                                                                                                                async function loadData() {
                                                                                                                                                                                                                                                                                                                                        try {
                                                                                                                                                                                                                                                                                                                                                    const res = await fetch(SHEET_URL);
                                                                                                                                                                                                                                                                                                                                                                const text = await res.text();
                                                                                                                                                                                                                                                                                                                                                                            const rows = JSON.parse(text.substring(47).slice(0, -2)).table.rows;
                                                                                                                                                                                                                                                                                                                                                                                        rows.forEach((r, i) => {
                                                                                                                                                                                                                                                                                                                                                                                                        if (i === 0) return;
                                                                                                                                                                                                                                                                                                                                                                                                                        const name = r.c?.v, malId = r.c?.v, s = r.c?.v || 1, e = r.c?.v || 1, url = r.c?.v;
                                                                                                                                                                                                                                                                                                                                                                                                                                        if (!name || !url) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (!animeDB[name]) animeDB[name] = { name, malId, episodes: [] };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        animeDB[name].episodes.push({ s, e, url: String(url).trim() });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                renderHome();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } catch (err) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("loader").innerText = "शीट लोड नहीं हुई। कृपया शीट को Public करें।";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function renderHome() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const home = document.getElementById("home-view");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("loader").style.display = "none";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            for (let k in animeDB) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const a = animeDB[k];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const card = document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                card.className = "anime-card";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            card.innerHTML = `<img id="img-${a.malId}" src="https://placeholder.com..."><div class="card-info"><div class="card-title">${a.name}</div><div class="rating" id="rt-${a.malId}">⭐ HD</div></div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        card.onclick = () => openDetail(k);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    home.appendChild(card);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (a.malId) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                fetch(`https://jikan.moe{a.malId}`).then(r => r.json()).then(d => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (d.data) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            a.poster = d.data.images.jpg.large_image_url; a.score = d.data.score; a.desc = d.data.synopsis;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById(`img-${a.malId}`).src = a.poster;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById(`rt-${a.malId}`).innerText = `⭐ ${a.score || '8.5'} • HD`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }).catch(()=>{});
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function openDetail(k) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const a = animeDB[k];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("home-view").style.display = "none";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("detail-view").style.display = "block";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("detail-title").innerText = a.name;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("detail-rating").innerText = `⭐ ${a.score || '8.5'} • कुल एपिसोड: ${a.episodes.length}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("detail-synopsis").innerText = a.desc || "नीचे से एपिसोड चुनकर देखें:";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const list = document.getElementById("episode-list"); list.innerHTML = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            a.episodes.forEach((ep, idx) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const btn = document.createElement("div"); btn.className = "ep-btn"; btn.innerText = `S${ep.s} E${ep.e}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    btn.onclick = () => { document.querySelectorAll(".ep-btn").forEach(b => b.classList.remove("active")); btn.classList.add("active"); playVideo(ep.url); };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                list.appendChild(btn); if (idx === 0) btn.click();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function playVideo(url) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const box = document.getElementById("player-container"); box.innerHTML = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (url.includes("youtu")) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let id = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&?]+)/);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        id = id ? id : url;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    box.innerHTML = `<iframe src="https://youtube-nocookie.com{id}?playsinline=1&rel=0&modestbranding=1" sandbox="allow-scripts allow-same-origin allow-presentation" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else if (url.includes(".m3u8")) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const v = document.createElement("video"); v.controls = true; v.autoplay = true; box.appendChild(v);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (Hls.isSupported()) { const h = new Hls(); h.loadSource(url); h.attachMedia(v); } else { v.src = url; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else if (url.includes(".mp4")) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        box.innerHTML = `<video src="${url}" controls autoplay playsinline></video>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const id = url.includes("/d/") ? url.match(/\/d\/(.+?)\//) : url;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        box.innerHTML = `<iframe src="https://google.com{id}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function goHome() { document.getElementById("player-container").innerHTML = ""; document.getElementById("detail-view").style.display = "none"; document.getElementById("home-view").style.display = "grid"; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            loadData();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
