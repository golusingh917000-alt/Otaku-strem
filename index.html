<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Otaku Stream - Final Creator Edition</title>
                <style>
                        body { background-color: #000; color: #fff; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; }
                                .poster-container { margin: 20px auto; max-width: 300px; cursor: pointer; border: 3px solid #ff4500; border-radius: 10px; overflow: hidden; box-shadow: 0 0 15px #ff4500; }
                                        .poster-container img { width: 100%; display: block; }
                                                .season-tabs { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
                                                        .season-btn { background: #1e1e1e; color: #fff; border: 2px solid #ff4500; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
                                                                .season-btn.active { background: #ff4500; }
                                                                        .episode-list { max-width: 500px; margin: 0 auto; display: none; text-align: left; }
                                                                                .episode-card { background: #111; border: 1px solid #333; padding: 15px; margin-bottom: 10px; border-radius: 8px; }
                                                                                        .episode-card h3 { margin: 0 0 10px 0; font-size: 16px; color: #ff9900; }
                                                                                                .action-grid { display: flex; gap: 10px; }
                                                                                                        .btn { flex: 1; text-align: center; padding: 8px; text-decoration: none; border-radius: 5px; font-weight: bold; color: #fff; }
                                                                                                                .btn-play { background: #00cc66; }
                                                                                                                        .btn-download { background: #ff3333; }
                                                                                                                            </style>
                                                                                                                            </head>
                                                                                                                            <body>

                                                                                                                                <h1>Anime Player</h1>

                                                                                                                                    <!-- 1. पोस्टर (इसपर क्लिक करते ही सीज़न के बटन खुलेंगे) -->
                                                                                                                                        <div class="poster-container" onclick="showSeasons()">
                                                                                                                                                <img src="https://justwatch.com" alt="Jujutsu Kaisen">
                                                                                                                                                        <h3 style="margin: 10px 0;">Jujutsu Kaisen (Hindi)</h3>
                                                                                                                                                            </div>

                                                                                                                                                                <!-- 2. सीज़न बटन -->
                                                                                                                                                                    <div class="season-tabs" id="seasonTabs" style="display: none;">
                                                                                                                                                                            <button class="season-btn" onclick="selectSeason('season1')">सीज़न 1</button>
                                                                                                                                                                                    <button class="season-btn" onclick="selectSeason('season2')">सीज़न 2</button>
                                                                                                                                                                                            <button class="season-btn" onclick="selectSeason('season3')">सीज़न 3</button>
                                                                                                                                                                                                </div>

                                                                                                                                                                                                    <!-- 3. एपिसोड लिस्ट दिखने की जगह -->
                                                                                                                                                                                                        <div id="episodeContainer" class="episode-list"></div>

                                                                                                                                                                                                            <script>
                                                                                                                                                                                                                    // 🎯 वीर भाई, अपनी गूगल शीट की सामान्य कॉपी की हुई लिंक यहाँ दोनों कॉमा के बीच पेस्ट कर दें!
                                                                                                                                                                                                                            const SHEET_LINK = "https://docs.google.com/spreadsheets/d/10gs9aHw9JWKFP7lY_j_k4OOdljkFv4pfNv69GVJ9lZY/edit?usp=drivesdk"; 
                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                            let animeData = { season1: [], season2: [], season3: [] };

                                                                                                                                                                                                                                                    if(SHEET_LINK !== "यहाँ_अपनी_गूगल_शीट_की_लिंक_पेस्ट_करें") {
                                                                                                                                                                                                                                                                const matches = SHEET_LINK.match(/\/d\/([a-zA-Z0-9-_]+)/);
                                                                                                                                                                                                                                                                            if (matches && matches[1]) {
                                                                                                                                                                                                                                                                                            const sheetId = matches[1];
                                                                                                                                                                                                                                                                                                            const csvUrl = `https://google.com{sheetId}/export?format=csv`;

                                                                                                                                                                                                                                                                                                                            fetch(csvUrl)
                                                                                                                                                                                                                                                                                                                                                .then(res => res.text())
                                                                                                                                                                                                                                                                                                                                                                    .then(text => {
                                                                                                                                                                                                                                                                                                                                                                                            const lines = text.split("\n").map(line => line.split(","));
                                                                                                                                                                                                                                                                                                                                                                                                                    for(let i = 1; i < lines.length; i++) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                if(lines[i].length >= 3) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const season = lines[i][0].replace(/"/g, "").toLowerCase().trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const title = lines[i][1].replace(/"/g, "").trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let driveUrl = lines[i][2].replace(/"/g, "").trim();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // गूगल ड्राइव लिंक को डायरेक्ट प्ले लिंक में बदलना
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if(driveUrl.includes("://google.com")) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const fileIdMatch = driveUrl.match(/\/d\/([a-zA-Z0-9-_]+)/) || driveUrl.match(/id=([a-zA-Z0-9-_]+)/);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if(fileIdMatch && fileIdMatch[1]) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                driveUrl = `https://google.com{fileIdMatch[1]}`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if(animeData[season]) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        animeData[season].push({ title: title, video_url: driveUrl });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }).catch(err => console.error("डेटा लोड एरर:", err));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function showSeasons() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('seasonTabs').style.display = 'flex';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function selectSeason(seasonKey) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const buttons = document.querySelectorAll('.season-btn');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                buttons.forEach(btn => btn.classList.remove('active'));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            event.target.classList.add('active');

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const container = document.getElementById('episodeContainer');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    container.innerHTML = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                container.style.display = 'block';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(animeData[seasonKey] && animeData[seasonKey].length > 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            animeData[seasonKey].forEach(ep => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                container.innerHTML += `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="episode-card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h3>${ep.title}</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="action-grid">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <a href="${ep.video_url}" class="btn btn-play" target="_blank">PLAY ▶️</a>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <a href="${ep.video_url}" class="btn btn-download" target="_blank">DOWNLOAD ⬇️</a>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    container.innerHTML = "<p style='text-align:center;'>इस सीज़न में अभी कोई एपिसोड नहीं है।</p>";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
