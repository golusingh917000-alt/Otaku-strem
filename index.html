<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Otaku Stream - Professional Anime Player</title>
                <style>
                        /* --- HARD CODED CSS: BLACK & NEON ORANGE --- */
                                body { 
                                            background-color: #050505; 
                                                        color: #ffffff; 
                                                                    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
                                                                                display: flex; 
                                                                                            justify-content: center; 
                                                                                                        align-items: center; 
                                                                                                                    height: 100vh; 
                                                                                                                                margin: 0; 
                                                                                                                                        }
                                                                                                                                                .video-container { 
                                                                                                                                                            position: relative; 
                                                                                                                                                                        width: 95%; 
                                                                                                                                                                                    max-width: 800px; 
                                                                                                                                                                                                background-color: #000000; 
                                                                                                                                                                                                            border: 3px solid #FF4500; 
                                                                                                                                                                                                                        border-radius: 12px; 
                                                                                                                                                                                                                                    overflow: hidden; 
                                                                                                                                                                                                                                                box-shadow: 0 0 20px rgba(255, 69, 0, 0.6); 
                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                video { 
                                                                                                                                                                                                                                                                            width: 100%; 
                                                                                                                                                                                                                                                                                        display: block; 
                                                                                                                                                                                                                                                                                                    cursor: pointer;
                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                    .controls { 
                                                                                                                                                                                                                                                                                                                                display: flex; 
                                                                                                                                                                                                                                                                                                                                            align-items: center; 
                                                                                                                                                                                                                                                                                                                                                        background-color: rgba(0, 0, 0, 0.9); 
                                                                                                                                                                                                                                                                                                                                                                    padding: 12px; 
                                                                                                                                                                                                                                                                                                                                                                                border-top: 2px solid #FF4500; 
                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                .control-btn { 
                                                                                                                                                                                                                                                                                                                                                                                                            background: none; 
                                                                                                                                                                                                                                                                                                                                                                                                                        border: none; 
                                                                                                                                                                                                                                                                                                                                                                                                                                    color: #FF4500; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                font-size: 22px; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                            cursor: pointer; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        margin-right: 15px; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    transition: transform 0.1s ease;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .control-btn:hover {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                transform: scale(1.1);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                #seek-bar { 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            flex-grow: 1; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        accent-color: #FF4500; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    cursor: pointer; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="video-container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- Jujutsu Kaisen Episode 01 Direct Stream Link Embedded -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <video id="anime-player" poster="https://alphacoders.com">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <source src="https://googleapis.com" type="video/mp4">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            आपका ब्राउज़र HTML5 वीडियो सपोर्ट नहीं करता है।
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </video>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="controls">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button id="play-pause" class="control-btn">▶</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="range" id="seek-bar" value="0" min="0" max="100">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    /* --- HARD CODED JAVASCRIPT ENGINE --- */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const video = document.getElementById('anime-player');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const playBtn = document.getElementById('play-pause');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const seekBar = document.getElementById('seek-bar');

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // Play and Pause Mechanism
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            playBtn.addEventListener('click', togglePlay);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    video.addEventListener('click', togglePlay);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function togglePlay() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (video.paused) { 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        video.play(); 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        playBtn.innerText = '⏸'; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } else { 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    video.pause(); 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    playBtn.innerText = '▶'; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Timeline Update Mechanism
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        video.addEventListener('timeupdate', () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const value = (100 / video.duration) * video.currentTime;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                seekBar.value = value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Scrubbing/Seeking Mechanism
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        seekBar.addEventListener('input', () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const time = video.duration * (seekBar.value / 100);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                video.currentTime = time;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
