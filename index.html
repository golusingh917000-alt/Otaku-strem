<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTAKU STREAM</title>
<style>
  body { margin:0; background:#0b0c10; color:#fff; font-family:sans-serif; padding:12px; }
    h2 { text-align:center; color:#ff4757; font-size:18px; margin-bottom:12px; }
      .box { width:100%; aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden; border:1px solid #333; }
        iframe { width:100%; height:100%; border:none; }
          .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:15px; }
            .btn { background:#1f2833; color:#fff; border:1px solid #45a29e; padding:10px; border-radius:6px; text-align:center; font-weight:bold; cursor:pointer; }
              .btn.active { background:#ff4757; border-color:#ff4757; }
              </style>
              </head>
              <body>
                <h2>JUJUTSU KAISEN • HINDI</h2>
                  <div class="box">
                      <iframe id="vid" src="https://youtube.com" allow="autoplay; fullscreen" allowfullscreen></iframe>
                        </div>
                          <div class="grid">
                              <div class="btn active" onclick="play('1Id_f3GDlus', this)">Episode 1</div>
                                  <div class="btn" onclick="play('यहाँ_EP2_ID_डालें', this)">Episode 2</div>
                                      <div class="btn" onclick="play('यहाँ_EP3_ID_डालें', this)">Episode 3</div>
                                        </div>
                                        <script>
                                          function play(id, el) {
                                              document.getElementById('vid').src = "https://youtube.com" + id + "?autoplay=1&rel=0";
                                                  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
                                                      el.classList.add('active');
                                                        }
                                                        </script>
                                                        </body>
                                                        </html>
