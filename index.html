<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#111;color:#fff;font-family:sans-serif;margin:0;text-align:center}
.top{background:linear-gradient(#ff4500,#111);padding:25px 10px}
iframe{width:95%;height:200px;border:2px solid #ff4500;border-radius:8px;display:none;margin:10px auto}
.tabs button{background:#111;color:#fff;border:1px solid #ff4500;padding:8px 16px;margin:10px 4px;border-radius:20px;font-weight:bold}
.tabs button.on{background:#ff4500}
.card{background:#1e1e1e;margin:10px auto;padding:12px;width:90%;border-left:4px solid #ff4500;border-radius:6px;display:flex;justify-content:space-between;align-items:center}
.btn{background:#ff4500;color:#fff;border:none;padding:6px 12px;border-radius:4px;text-decoration:none;font-size:13px;margin-left:5px}
.dl{background:#333;color:#ff4500;border:1px solid #ff4500}
</style>
</head>
<body>
<div class="top"><h2>Jujutsu Kaisen (Hindi)</h2></div>
<iframe id="vid" allowfullscreen></iframe>
<div class="tabs">
<button class="on" onclick="show('सीजन 1',this)">सीज़न 1</button>
<button onclick="show('सीजन 2',this)">सीज़न 2</button>
<button onclick="show('सीजन 3',this)">सीज़न 3</button>
</div>
<div id="list">लोड हो रहा है...</div>
<script>
const URL="https://google.com"+Date.now();
let data=[];
fetch(URL).then(r=>r.text()).then(t=>{
  t.split('\n').slice(1).forEach(r=>{
      let c=r.split(',').map(x=>x.replace(/^"|"$/g,'').trim());
          if(c.length>=3)data.push({s:c.shift(),e:c.shift(),u:c.shift()});
            });
              show('सीजन 1');
              }).catch(()=>document.getElementById('list').innerHTML='डेटा लोड नहीं हुआ');

              function show(s,b){
                if(b){document.querySelectorAll('.tabs button').forEach(x=>x.className='');b.className='on';}
                  let f=data.filter(x=>x.s.replace(/ज़/g,'ज')==s.replace(/ज़/g,'ज'));
                    document.getElementById('list').innerHTML=f.length?f.map(x=>`<div class="card"><span>${x.e}</span><div><button class="btn" onclick="play('${x.u}')">▶ प्ले</button><a class="btn dl" href="${x.u}" target="_blank">⬇</a></div></div>`).join(''):'कोई एपिसोड नहीं';
                    }
                    function play(u){let v=document.getElementById('vid');v.style.display='block';v.src=u;}
                    </script>
                    </body>
                    </html>
