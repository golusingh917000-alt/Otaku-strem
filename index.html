<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTAKU STREAM</title>
<style>
  body { margin:0; background:#0b0c10; color:#fff; font-family:sans-serif; padding:12px; }
    h1 { text-align:center; color:#ff4757; font-size:18px; border-bottom:2px solid #ff4757; padding-bottom:10px; }
      .player { width:100%; aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden; margin:12px 0; }
        iframe, video { width:100%; height:100%; border:none; }
          .grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-top:10px; }
            .btn { background:#1f2833; color:#fff; border:1px solid #45a29e; padding:10px; border-radius:6px; text-align:center; font-weight:bold; }
              .btn.active { background:#ff4757; border-color:#ff4757; }
              </style>
              </head>
              <body>
                <h1>OTAKU STREAM • HINDI</h1>
                  <div class="player" id="box"></div>
                    <div id="status" style="color:#66fcf1; text-align:center;">एपिसोड लोड हो रहे हैं...</div>
                      <div class="grid" id="list"></div>

                      <script>
                      const SHEET_ID = "10gs9aHw9JWKFP7lY_j_k4OOdljkFv4pfNv69GVJ9lZY";
                      const URL = `https://google.com{SHEET_ID}/gviz/tq?tqx=out:json`;

                      fetch(URL).then(r => r.text()).then(t => {
                        const rows = JSON.parse(t.substring(47).slice(0, -2)).table.rows;
                          const list = document.getElementById("list");
                            document.getElementById("status").innerText = "एपिसोड चुनें:";
                              
                                rows.forEach((r, i) => {
                                    if (i === 0 || !r.c) return;
                                        // अगर 3 कॉलम हैं तो तीसरा कॉलम, अगर 5 कॉलम हैं तो पाँचवाँ कॉलम लेगा
                                            const link = r.c[4] ? r.c[4].v : (r.c[2] ? r.c[2].v : "");
                                                const s = r.c[4] ? (r.c[2]?.v || 1) : (r.c[0]?.v || 1);
                                                    const e = r.c[4] ? (r.c[3]?.v || i) : (r.c[1]?.v || i);
                                                        if (!link) return;

                                                            const btn = document.createElement("div");
                                                                btn.className = "btn";
                                                                    btn.innerText = `S${s} E${e}`;
                                                                        btn.onclick = () => {
                                                                              document.querySelectorAll(".btn").forEach(b => b.classList.remove("active"));
                                                                                    btn.classList.add("active");
                                                                                          play(String(link).trim());
                                                                                              };
                                                                                                  list.appendChild(btn);
                                                                                                      if (i === 1) btn.click();
                                                                                                        });
                                                                                                        }).catch(() => {
                                                                                                          document.getElementById("status").innerText = "शीट लोड नहीं हुई! शीट को Public करें।";
                                                                                                          });

                                                                                                          function play(url) {
                                                                                                            const box = document.getElementById("box");
                                                                                                              if (url.includes("youtu")) {
                                                                                                                  const m = url.match(/(?:youtu\.be\/|embed\/|v=|watch\?v=)([^&?]+)/);
                                                                                                                      const id = m ? m[1] : url;
                                                                                                                          box.innerHTML = `<iframe src="https://youtube-nocookie.com{id}?playsinline=1&rel=0" sandbox="allow-scripts allow-same-origin allow-presentation" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
                                                                                                                            } else {
                                                                                                                                const id = url.includes("/d/") ? url.match(/\/d\/(.+?)\//)[1] : url;
                                                                                                                                    box.innerHTML = `<iframe src="https://google.com{id}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
                                                                                                                                      }
                                                                                                                                      }
                                                                                                                                      </script>
                                                                                                                                      </body>
                                                                                                                                      </html>
