<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Anime Player</title>
                <style>
                        body { font-family: sans-serif; background: #111; color: #fff; margin: 0; padding: 15px; text-align: center; }
                                .banner { width: 100%; max-width: 400px; border-radius: 8px; border: 2px solid #ff4500; }
                                        .tabs { display: flex; justify-content: center; gap: 8px; margin: 15px 0; }
                                                .btn { background: #222; color: #fff; border: 2px solid #ff4500; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; flex: 1; max-width: 110px; }
                                                        .btn.active { background: #ff4500; }
                                                                .ep-card { background: #1a1a1a; padding: 12px; margin: 10px auto; max-width: 400px; border-radius: 6px; text-align: left; border-left: 4px solid #ff4500; }
                                                                        .actions { display: flex; gap: 8px; margin-top: 8px; }
                                                                                .action-btn { flex: 1; padding: 8px; border: none; border-radius: 4px; color: #fff; font-weight: bold; text-align: center; text-decoration: none; font-size: 14px; cursor: pointer; }
                                                                                        .play { background: #ff4500; }
                                                                                                .down { background: #008CBA; }
                                                                                                        iframe { width: 100%; max-width: 400px; height: 220px; display: none; border: 2px solid #ff4500; border-radius: 6px; margin-bottom: 15px; }
                                                                                                            </style>
                                                                                                            </head>
                                                                                                            <body>

                                                                                                                <!-- वीडियो प्लेयर ऊपर दिखेगा -->
                                                                                                                    <iframe id="player" src="" allowfullscreen></iframe>

                                                                                                                        <!-- पोस्टर बैनर -->
                                                                                                                            <img class="banner" src="https://justwatch.com">
                                                                                                                                <h3 style="color:#ff4500; margin:10px 0;">Jujutsu Kaisen (Hindi)</h3>

                                                                                                                                    <!-- सीज़न बटन्स -->
                                                                                                                                        <div class="tabs">
                                                                                                                                                <button class="btn" onclick="loadSeason('सीजन 1', this)">सीज़न 1</button>
                                                                                                                                                        <button class="btn" onclick="loadSeason('सीजन 2', this)">सीज़न 2</button>
                                                                                                                                                                <button class="btn" onclick="loadSeason('सीजन 3', this)">सीज़न 3</button>
                                                                                                                                                                    </div>

                                                                                                                                                                        <!-- एपिसोड लिस्ट की जगह -->
                                                                                                                                                                            <div id="episodes"><p style="color:#aaa;">ऊपर से सीज़न चुनिए...</p></div>

                                                                                                                                                                                <script>
                                                                                                                                                                                        const SHEET_URL = "https://google.com";

                                                                                                                                                                                                async function loadSeason(name, el) {
                                                                                                                                                                                                                document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
                                                                                                                                                                                                                            el.classList.add('active');
                                                                                                                                                                                                                                        const div = document.getElementById("episodes");
                                                                                                                                                                                                                                                    div.innerHTML = "लोड हो रहा है...";
                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                            try {
                                                                                                                                                                                                                                                                                                const res = await fetch(SHEET_URL);
                                                                                                                                                                                                                                                                                                                const txt = await res.text();
                                                                                                                                                                                                                                                                                                                                const json = JSON.parse(txt.substring(47, txt.length - 2));
                                                                                                                                                                                                                                                                                                                                                let html = "";
                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                json.table.rows.forEach(r => {
                                                                                                                                                                                                                                                                                                                                                                                                        const s = r.c[0] ? r.c[0].v : "";
                                                                                                                                                                                                                                                                                                                                                                                                                            const e = r.c[1] ? r.c[1].v : "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                const u = r.c[2] ? r.c[2].v : "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (s.toString().trim() === name.trim()) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    html += `<div class="ep-card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div><strong>${e}</strong></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="actions">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button class="action-btn play" onclick="play('${u}')">🎬 प्ले</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <a class="action-btn down" href="${u}" target="_blank">📥 डाउनलोड</a>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                                                                                                                div.innerHTML = html || "<p style='color:#aaa;'>इस सीज़न में कोई एपिसोड नहीं है।</p>";
                                                                                                                                                                                                                                                                            } catch { div.innerHTML = "<p style='color:red;'>डेटा लोड नहीं हो पाया!</p>"; }
                                                                                                                                                                                                }

                                                                                                                                                                                                        function play(url) {
                                                                                                                                                                                                                        const p = document.getElementById("player");
                                                                                                                                                                                                                                    p.src = url; 
                                                                                                                                                                                                                                                p.style.display = "block";
                                                                                                                                                                                                                                                            window.scrollTo({top: 0, behavior: 'smooth'});
                                                                                                                                                                                                        }
                                                                                                                                                                                                            </script>
                                                                                                                                                                                                            </body>
                                                                                                                                                                                                            </html>
                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                })
                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                }
