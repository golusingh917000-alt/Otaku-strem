<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Otaku Stream - Anime Player</title>
        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
                body { background-color: #111; color: #fff; padding-bottom: 40px; }
                    
                        /* Crunchyroll Style Banner */
                            .banner {
                                  position: relative;
                                        width: 100%;
                                              height: 220px;
                                                    background: linear-gradient(to bottom, rgba(17,17,17,0.2), #111), 
                                                                      url('https://alphacoders.com') center/cover no-repeat;
                                                                            display: flex;
                                                                                  align-items: flex-end;
                                                                                        justify-content: center;
                                                                                              padding-bottom: 15px;
                                                                                                  }
                                                                                                      .title {
                                                                                                            font-size: 24px;
                                                                                                                  font-weight: bold;
                                                                                                                        color: #ff4500;
                                                                                                                              text-shadow: 0 2px 10px rgba(0,0,0,0.9);
                                                                                                                                    text-align: center;
                                                                                                                                        }

                                                                                                                                            /* Video Player Box */
                                                                                                                                                .player-wrapper {
                                                                                                                                                      display: none;
                                                                                                                                                            width: 94%;
                                                                                                                                                                  max-width: 720px;
                                                                                                                                                                        margin: 15px auto;
                                                                                                                                                                              background: #000;
                                                                                                                                                                                    border: 2px solid #ff4500;
                                                                                                                                                                                          border-radius: 10px;
                                                                                                                                                                                                overflow: hidden;
                                                                                                                                                                                                    }
                                                                                                                                                                                                        .player-wrapper iframe {
                                                                                                                                                                                                              width: 100%;
                                                                                                                                                                                                                    height: 215px;
                                                                                                                                                                                                                          border: none;
                                                                                                                                                                                                                                display: block;
                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                        .now-playing {
                                                                                                                                                                                                                                              background: #1c1c1c;
                                                                                                                                                                                                                                                    color: #ff4500;
                                                                                                                                                                                                                                                          padding: 8px 12px;
                                                                                                                                                                                                                                                                font-size: 14px;
                                                                                                                                                                                                                                                                      font-weight: bold;
                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                              /* Season Tabs */
                                                                                                                                                                                                                                                                                  .seasons {
                                                                                                                                                                                                                                                                                        display: flex;
                                                                                                                                                                                                                                                                                              justify-content: center;
                                                                                                                                                                                                                                                                                                    gap: 10px;
                                                                                                                                                                                                                                                                                                          margin: 15px 10px 20px;
                                                                                                                                                                                                                                                                                                                flex-wrap: wrap;
                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                        .season-btn {
                                                                                                                                                                                                                                                                                                                              background: transparent;
                                                                                                                                                                                                                                                                                                                                    color: #fff;
                                                                                                                                                                                                                                                                                                                                          border: 2px solid #ff4500;
                                                                                                                                                                                                                                                                                                                                                padding: 8px 20px;
                                                                                                                                                                                                                                                                                                                                                      border-radius: 25px;
                                                                                                                                                                                                                                                                                                                                                            font-size: 15px;
                                                                                                                                                                                                                                                                                                                                                                  font-weight: bold;
                                                                                                                                                                                                                                                                                                                                                                        cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                              transition: 0.3s;
                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                      .season-btn.active, .season-btn:hover {
                                                                                                                                                                                                                                                                                                                                                                                            background: #ff4500;
                                                                                                                                                                                                                                                                                                                                                                                                  color: #fff;
                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                          /* Episode List */
                                                                                                                                                                                                                                                                                                                                                                                                              .episode-list {
                                                                                                                                                                                                                                                                                                                                                                                                                    width: 94%;
                                                                                                                                                                                                                                                                                                                                                                                                                          max-width: 720px;
                                                                                                                                                                                                                                                                                                                                                                                                                                margin: 0 auto;
                                                                                                                                                                                                                                                                                                                                                                                                                                      display: flex;
                                                                                                                                                                                                                                                                                                                                                                                                                                            flex-direction: column;
                                                                                                                                                                                                                                                                                                                                                                                                                                                  gap: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                          .episode-card {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                background: #1a1a1a;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      border-left: 4px solid #ff4500;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            border-radius: 8px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  padding: 12px 15px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        display: flex;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              justify-content: space-between;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    align-items: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          box-shadow: 0 4px 6px rgba(0,0,0,0.4);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .ep-name {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        font-size: 16px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              font-weight: 600;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    color: #f1f1f1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          text-transform: capitalize;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .btn-group {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        display: flex;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              gap: 8px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .btn {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            padding: 7px 14px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  border: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        border-radius: 6px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              font-size: 13px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    font-weight: bold;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                text-decoration: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      display: inline-block;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .play-btn { background: #ff4500; color: #fff; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .dl-btn { background: #2c2c2c; color: #ff4500; border: 1px solid #ff4500; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .status-msg { text-align: center; color: #ff4500; font-size: 16px; margin-top: 20px; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="banner">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="title">Jujutsu Kaisen (Hindi)</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <!-- Video Player -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="player-wrapper" id="playerBox">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="now-playing" id="nowPlayingText">चलाया जा रहा है...</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <iframe id="videoFrame" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <!-- Season Buttons -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="seasons">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <button class="season-btn active" onclick="filterSeason('सीजन 1', this)">सीज़न 1</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <button class="season-btn" onclick="filterSeason('सीजन 2', this)">सीज़न 2</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <button class="season-btn" onclick="filterSeason('सीजन 3', this)">सीज़न 3</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <!-- Episodes Container -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="episode-list" id="episodeContainer">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="status-msg">एपिसोड्स लोड हो रहे हैं...</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const SHEET_ID = "10gs9aHw9JWKFP7lY_j_k4OOdljkFv4pfNv69GVJ9lZY";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const SHEET_URL = `https://google.com{SHEET_ID}/gviz/tq?tqx=out:json`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let allEpisodes = [];

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            async function fetchSheetData() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const res = await fetch(SHEET_URL);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const text = await res.text();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const json = JSON.parse(text.substring(47).slice(0, -2));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const rows = json.table.rows;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          allEpisodes = rows.map(row => ({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    season: row.c[0] ? String(row.c[0].v).trim() : "",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              episode: row.c[1] ? String(row.c[1].v).trim() : "",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        url: row.c[2] ? String(row.c[2].v).trim() : ""
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                })).filter(item => item.season && item.episode && item.season !== "season");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        renderEpisodes("सीजन 1");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              } catch (err) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      document.getElementById("episodeContainer").innerHTML = 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                '<div class="status-msg">डेटा लोड नहीं हो पाया! इंटरनेट चेक करें।</div>';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              function filterSeason(seasonName, btnElement) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.querySelectorAll('.season-btn').forEach(btn => btn.classList.remove('active'));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (btnElement) btnElement.classList.add('active');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                renderEpisodes(seasonName);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function renderEpisodes(selectedSeason) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const container = document.getElementById("episodeContainer");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const normalize = str => str.replace(/ज़/g, "ज").toLowerCase().trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const filtered = allEpisodes.filter(ep => normalize(ep.season) === normalize(selectedSeason));

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (filtered.length === 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        container.innerHTML = `<div class="status-msg">${selectedSeason} में अभी कोई एपिसोड नहीं है।</div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
